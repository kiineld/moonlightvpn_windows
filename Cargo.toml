[workspace]
resolver = "2"
members = [
    "crates/moonlight-design",
    "crates/moonlight-core",
    "crates/moonlight",
    "crates/moonlight-helper",
]

[workspace.package]
version = "0.11.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kiineld/moonlightvpn_windows"

[workspace.dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "canvas",
    "image",
    "tokio",
    "advanced",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# native-tls rather than rustls: on Windows that is schannel, which uses the
# machine's own certificate store. A corporate root that Windows already trusts
# then works without shipping a CA bundle, and the build needs no C toolchain,
# which is what lets `cargo check --target x86_64-pc-windows-msvc` run from a
# developer's Mac.
reqwest = { version = "0.12", default-features = false, features = [
    "native-tls",
    "json",
    "gzip",
    "stream",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync", "fs"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
regex = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }

[workspace.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Services",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Networking_WinInet",
    # Reading a programme's own icon out of its executable: SHGetFileInfoW hands
    # back an HICON, and turning one into pixels is GDI's job.
    "Win32_Graphics_Gdi",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
