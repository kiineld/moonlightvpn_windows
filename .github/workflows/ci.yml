name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The whole workspace is checked for Windows from Linux as well as built on
  # Windows. The cross-check is fast and catches a broken #[cfg(windows)] block
  # in a minute rather than after a full Windows runner has booted.
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --target x86_64-pc-windows-msvc
      - run: cargo clippy --workspace -- -D warnings

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools
      - name: Fetch fonts and the core
        run: |
          .\scripts\fetch-fonts.ps1
          .\scripts\fetch-mihomo.ps1
      - run: cargo build --workspace
      # The integration suite runs the real mihomo.exe: every config shape the
      # app can produce goes through `mihomo -t`. TUN configs are validated but
      # never started, because CI does not run elevated.
      - run: cargo test --workspace
        env:
          MOONLIGHT_MIHOMO: ${{ github.workspace }}\resources\mihomo\mihomo.exe
