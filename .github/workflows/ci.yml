name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Checked for Windows from Linux as well as built on Windows. The cross-check
  # is fast and catches a broken #[cfg(windows)] block in a minute rather than
  # after a Windows runner has booted and compiled iced.
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --target x86_64-pc-windows-msvc

      # Linted for the Windows target, not the host. iced pulls in softbuffer,
      # whose Linux backends do not compile on a headless runner without X11 and
      # Wayland development packages — and the Windows configuration is the one
      # that ships, so it is the one worth linting.
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      # The Windows lint above cannot see the #[cfg(not(windows))] stubs, and
      # those are what a developer builds against. moonlight-core does not
      # depend on iced, so it lints on the host cleanly.
      - run: cargo clippy -p moonlight-core --all-targets -- -D warnings

  # The unit tests, and the integration suite against the real core. This runs
  # the config shapes through `mihomo -t` and starts one for real, which is the
  # only way to know the core accepts what this client is sure about — it
  # refuses a whole config for one malformed rule.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools

      - name: Fetch fonts and the core
        run: |
          .\scripts\fetch-fonts.ps1
          .\scripts\fetch-mihomo.ps1

      - run: cargo build --workspace

      - name: Unit tests
        run: cargo test --workspace --lib --bins

      # --test-threads=1 because these bind a controller port, write HKCU and
      # install a service; two at once would fight over all three.
      - name: Integration tests
        run: cargo test --workspace --test integration -- --test-threads=1
        env:
          MOONLIGHT_MIHOMO: ${{ github.workspace }}\resources\mihomo\mihomo.exe
          MOONLIGHT_HELPER: ${{ github.workspace }}\target\debug\moonlight-helper.exe
          # The runner is an administrator, so the service tests can run. They
          # are opt-in precisely because they change machine state, which is
          # fine on a runner that is thrown away and not on a laptop.
          MOONLIGHT_ADMIN_TESTS: '1'
