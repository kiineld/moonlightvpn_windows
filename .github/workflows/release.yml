name: Release

on:
  push:
    tags: ['v*']
  # Buildable by hand too, so a broken release does not need a throwaway tag to
  # retry — tags are permanent and a v0.1.1 spent on a typo in a YAML file is a
  # version number nobody can reuse.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # See ci.yml: rustup ships with the runner, and the action is one more
      # download that can 429.
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install fonttools

      - name: Build
        run: .\scripts\build.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signing is a no-op unless a certificate is configured. Without it
      # SmartScreen warns on first run — that needs a code-signing certificate
      # bought from a CA, and no amount of build configuration substitutes for
      # one. With SIGNING_CERTIFICATE (base64 .pfx) and SIGNING_PASSWORD set as
      # repository secrets, both executables are signed and the warning goes.
      #
      # An EV certificate clears SmartScreen immediately; an OV one only once
      # the binary has built enough reputation, which takes downloads and time.
      - name: Sign
        if: ${{ env.SIGNING_CERTIFICATE != '' }}
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          foreach ($exe in @('dist\Moonlight\moonlight.exe', 'dist\Moonlight\moonlight-helper.exe')) {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGNING_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw "signing $exe failed" }
          }
          Remove-Item $pfx -Force

      # The installer is the one most people should take: it puts the app, the
      # core, the Wintun driver and the helper in one place, and registers the
      # TUN service while it already has the elevation to do so.
      #
      # ISCC ships on the windows runner image; the fallback is there so a change
      # to that image costs a slow install rather than a failed release.
      - name: Installer
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          # A manual run's ref_name is a branch, not a tag, and Inno stamps this
          # into the binary's version resource — which must be numeric.
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){0,3}$') { $version = '0.0.0' }
          & $iscc "/DAppVersion=$version" installer\moonlight.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Copy-Item installer-out\Moonlight-Setup.exe Moonlight-Setup.exe

      # Four assets, because they answer different questions:
      #   - the installer is the default route: one file, sets everything up
      #   - the zip is the portable layout, for anyone who does not want an
      #     installer or cannot elevate
      #   - the two bare .exe files are for replacing a single binary in place
      #
      # None of the names carry a version, so the latest-release URLs keep
      # working across releases — the version is in the release title.
      # The installer carries the signed binaries but is itself a new executable,
      # so it needs its own signature or SmartScreen warns on the one file most
      # people will actually run.
      - name: Sign installer
        if: ${{ env.SIGNING_CERTIFICATE != '' }}
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SIGNING_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 Moonlight-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signing the installer failed" }
          Remove-Item $pfx -Force

      - name: Package
        run: |
          Compress-Archive -Path dist\Moonlight\* -DestinationPath Moonlight-x86_64.zip
          Copy-Item dist\Moonlight\moonlight.exe        Moonlight.exe
          Copy-Item dist\Moonlight\moonlight-helper.exe Moonlight-Helper.exe
          Get-ChildItem *.zip, *.exe | Format-Table Name, Length

      # Written with LF, not PowerShell's default CRLF: `sha256sum -c` and
      # `shasum -c` treat the trailing \r as part of the filename, so a CRLF
      # file fails to verify on Linux and macOS with "No such file or
      # directory" while the hashes themselves are perfectly correct.
      - name: Checksums
        run: |
          $lines = Get-FileHash Moonlight-Setup.exe, Moonlight-x86_64.zip, Moonlight.exe, Moonlight-Helper.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          [System.IO.File]::WriteAllText(
            "$PWD\SHA256SUMS.txt",
            ($lines -join "`n") + "`n",
            (New-Object System.Text.UTF8Encoding $false)
          )
          Get-Content SHA256SUMS.txt

      # A manual run has no tag to attach a release to, so it stops here —
      # it exists to prove the build works before a tag is spent on it.
      - name: Upload artifacts (manual runs)
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-x86_64
          path: |
            Moonlight-x86_64.zip
            SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Moonlight-Setup.exe
            Moonlight-x86_64.zip
            Moonlight.exe
            Moonlight-Helper.exe
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Unsigned, so SmartScreen will warn on first run: **More info →
            Run anyway**.

            Everything is wired: the tunnel controller drives the core, writes
            the proxy settings and talks to the helper, and all seven screens
            are real. The interface has now been driven on real Windows
            hardware and corrected against the macOS client screen by screen.

            What still has not happened is a **live tunnel**: CI exercises the
            registry, the service, the named pipe and a real mihomo core on a
            Windows runner, but no session has been left connected carrying a
            machine's own traffic, and TUN has never created a Wintun adapter.
            See *What is not done yet* in the README.

            | File | |
            |---|---|
            | `Moonlight-Setup.exe` | **Start here.** Installs the app, the core and the driver, and registers the TUN service in the same elevation. |
            | `Moonlight-x86_64.zip` | The same files as a portable folder, for anyone who would rather not run an installer. |
            | `Moonlight.exe` | The app alone. TUN needs `moonlight-helper.exe` beside it, so this is for replacing one binary, not for a first install. |
            | `Moonlight-Helper.exe` | The privileged service alone. |

            Windows 10 1809 or later, x64.
